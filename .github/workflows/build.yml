name: Build Docker image

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本标签 (例如: v1.2.0)'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/zisbusy/baota-docker

jobs:
  # 预处理 ref_name，避免分支名包含 / 时无法作为镜像 tag
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ref_tag: ${{ steps.sanitize.outputs.ref_tag }}
    steps:
      - name: Sanitize ref name for image tag
        id: sanitize
        run: |
          ref="${{ github.ref_name }}"
          ref="${ref//\//-}"
          echo "ref_tag=$ref" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push single-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            # 核心修改：使用手动输入的 version，如果为空则默认 latest
            ${{ env.IMAGE_NAME }}:${{ github.event.inputs.version || 'latest' }}-${{ matrix.arch }}
            # 保留原有的 commit SHA 和分支名标签
            ${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}
            ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.ref_tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        env:
          REF_TAG: ${{ needs.prepare.outputs.ref_tag }}
          # 核心修改：将手动输入的版本号传递给环境变量
          IMAGE_VERSION: ${{ github.event.inputs.version || 'latest' }}
        run: |
          set -euo pipefail

          # 1. 合并自定义版本标签 (例如: v1.2.0)
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$IMAGE_VERSION" \
            "$IMAGE_NAME:$IMAGE_VERSION-amd64" \
            "$IMAGE_NAME:$IMAGE_VERSION-arm64"

          # 2. 合并 commit SHA 标签
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:${{ github.sha }}" \
            "$IMAGE_NAME:${{ github.sha }}-amd64" \
            "$IMAGE_NAME:${{ github.sha }}-arm64"

          # 3. 合并分支/标签名标签
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:${REF_TAG}" \
            "$IMAGE_NAME:${REF_TAG}-amd64" \
            "$IMAGE_NAME:${REF_TAG}-arm64"

      - name: Image info
        run: |
          echo "Image pushed: $IMAGE_NAME:$IMAGE_VERSION"
