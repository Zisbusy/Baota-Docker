# 构建并推送多平台镜像到 GHCR（x86_64 & arm64）
name: Build Docker image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/zisbusy/baota-docker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # tags: latest, commit SHA and ref name (branch or tag)
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          # use registry cache to speed repeated builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
          build-args: |
            # add build-time args here if needed, e.g.
            # HTTP_PROXY=${{ secrets.HTTP_PROXY }}
      - name: Image info
        run: |
          echo "Image pushed: $IMAGE_NAME"
